# OwnTone on a Spotifactory box: streams the box's own audio on to Google
# Cast and AirPlay speakers (src/spotifactory/owntone.py). Installed by
# deploy/upgrade.sh as /etc/owntone.conf. Anything not set here keeps
# OwnTone's default.

general {
	uid = "owntone"
	db_path = "/var/cache/owntone/songs3.db"
	logfile = "/var/log/owntone.log"
	loglevel = log
	# Only the app on this box controls it.
	trusted_networks = { "localhost" }
	ipv6 = no
}

library {
	name = "Spotifactory"
	port = 3689
	# Holds only the pipe the box's audio comes through: "spotifactory",
	# a fifo PipeWire writes to (sink "spotifactory_network").
	directories = { "/srv/music" }
	# Start playing when audio arrives in the pipe.
	pipe_autostart = true
}

# No local output: the box's own speaker is played by PipeWire directly.
audio {
	type = "disabled"
}

mpd {
	port = 0
}
